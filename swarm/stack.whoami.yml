services:
  whoami:
    image: traefik/whoami:v1.10.3
    networks: [edge_public]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 64M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=PathPrefix(`/api/whoami`)"
        - "traefik.http.routers.whoami.entrypoints=web"
        - "traefik.http.routers.whoami.middlewares=strip-api"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  edge_public:
    external: true